name: Build and validate reference release candidate

on:
  workflow_dispatch:
  push:
    branches: [finish-reference-release]

# The temporary completion branch produces RC2 only. Existing release assets,
# including RC1, are never replaced; final promotion requires evidence review.
permissions:
  contents: read

concurrency:
  group: reference-release-app-v0.7.0-rc2
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'comparativechrono/workbench' && github.ref == 'refs/heads/finish-reference-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CANDIDATE_TAG: app-v0.7.0-rc2
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      asset_name: ${{ steps.publish.outputs.asset_name }}
      asset_sha256: ${{ steps.publish.outputs.asset_sha256 }}
      update_sha256: ${{ steps.publish.outputs.update_sha256 }}
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse to replace an existing candidate or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "app-v0.7.0-rc2") | .id')
          if [[ -n "$existing_release" ]]; then
            echo 'RC2 already exists, including possibly a retained draft. Do not rebuild or replace it. Re-run failed Windows jobs only, or review and assign a new candidate identity.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/tags/' + os.environ['CANDIDATE_TAG']
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request):
                  raise SystemExit('Candidate tag already exists; refusing to reuse it.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
      - name: Recover and verify pinned application and compiler inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference-inputs" "$RUNNER_TEMP/reference-toolchain"
          cd "$RUNNER_TEMP/reference-inputs"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output native-workbench-0.6.0-starter-windows.zip https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-starter-windows.zip
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output native-workbench-0.6.0-source.zip https://github.com/comparativechrono/workbench/releases/download/app-v0.6.0/native-workbench-0.6.0-source.zip
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          sha256sum --check --strict <<'CHECKSUMS'
          16fa802304c734b5721d838ff38b7e90ed36ccfc185a22239859cc3762af695a  native-workbench-0.6.0-starter-windows.zip
          427a9b42f2528984350479e8b0155e4ef4f0159fa6f240cc1aa84a5ec2e0e60a  native-workbench-0.6.0-source.zip
          bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          CHECKSUMS
          tar -xJf llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz -C "$RUNNER_TEMP/reference-toolchain"
          echo "BW_MINGW_ROOT=$RUNNER_TEMP/reference-toolchain/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
      - name: Check source, compile native components and package the candidate
        run: |
          set -euo pipefail
          python3 scripts/build_reference_release.py \
            --inputs "$RUNNER_TEMP/reference-inputs" \
            --output "$GITHUB_WORKSPACE/dist/reference-rc2" \
            --work "$RUNNER_TEMP/reference-build" \
            --source-commit "$GITHUB_SHA" --release-tag "$CANDIDATE_TAG"
      - name: Publish only new immutable candidate assets and verify public downloads
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/dist/reference-rc2"
          python3 scripts/build_reference_release.py --verify-release "$release_dir" \
            --verification-report "$RUNNER_TEMP/reference-build/evidence/pre-publication-readiness.json"
          assets=(
            native-workbench-0.7.0-source.zip
            native-workbench-0.7.0-starter-windows.zip
            native-workbench-0.7.0-update-from-0.6.0.zip
            reference-build-report.json
            REFERENCE-CANDIDATE-README.md
            SHA256SUMS.txt
          )
          upload_paths=()
          for asset_name in "${assets[@]}"; do upload_paths+=("$release_dir/$asset_name"); done
          # Upload to a new draft first. A failure deliberately retains the draft
          # for diagnosis; no retry deletes or overwrites existing assets.
          gh release create "$CANDIDATE_TAG" "${upload_paths[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'Native Workbench 0.7.0 reference candidate 2' \
            --notes-file "$release_dir/REFERENCE-CANDIDATE-README.md"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/reference-draft-download"
          python3 scripts/build_reference_release.py --verify-release "$RUNNER_TEMP/reference-draft-download" \
            --verification-report "$RUNNER_TEMP/reference-build/evidence/draft-download-readiness.json"
          cmp "$release_dir/SHA256SUMS.txt" "$RUNNER_TEMP/reference-draft-download/SHA256SUMS.txt"
          gh release edit "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          mkdir "$RUNNER_TEMP/reference-public-download"
          for asset_name in "${assets[@]}"; do
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              --output "$RUNNER_TEMP/reference-public-download/$asset_name" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$CANDIDATE_TAG/$asset_name"
            cmp "$release_dir/$asset_name" "$RUNNER_TEMP/reference-public-download/$asset_name"
          done
          python3 scripts/build_reference_release.py --verify-release "$RUNNER_TEMP/reference-public-download" \
            --verification-report "$RUNNER_TEMP/reference-build/evidence/public-download-readiness.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reference-public-download'
          assets = [{'file': p.name, 'bytes': p.stat().st_size,
                     'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir())]
          report = {'schema': 1, 'candidate_tag': os.environ['CANDIDATE_TAG'],
                    'source_commit': os.environ['GITHUB_SHA'], 'unauthenticated_downloads_verified': True,
                    'assets': assets, 'final_release': False}
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reference-build/evidence/public-downloads.json'
          evidence.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          hashes = {asset['file']: asset['sha256'] for asset in assets}
          starter = 'native-workbench-0.7.0-starter-windows.zip'
          updater = 'native-workbench-0.7.0-update-from-0.6.0.zip'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('release_tag=' + os.environ['CANDIDATE_TAG'] + '\n')
              output.write('asset_name=' + starter + '\n')
              output.write('asset_sha256=' + hashes[starter] + '\n')
              output.write('update_sha256=' + hashes[updater] + '\n')
          PY
      - name: Retain build reports, checks and exact candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-candidate-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-build/evidence
            ${{ github.workspace }}/dist/reference-rc2
          if-no-files-found: warn
          retention-days: 30
  native:
    needs: package
    permissions:
      contents: read
    uses: ./.github/workflows/native-reference-check.yml
    with:
      release_tag: ${{ needs.package.outputs.release_tag }}
      asset_name: ${{ needs.package.outputs.asset_name }}
      asset_sha256: ${{ needs.package.outputs.asset_sha256 }}
      update_sha256: ${{ needs.package.outputs.update_sha256 }}
